name: hugo-build-push-root

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      branch_name:
        description: 'Branch Name'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.93.0'
          extended: true

      - name: Checkout repository and setup Hugo
        env:
          BRANCH_NAME: ${{ github.event.inputs.branch_name }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          git clone --recurse-submodules "${SERVER_URL}/${REPO}.git" && cd kubeflow-manifests
          git checkout "$BRANCH_NAME"
          cd website
          npm install postcss-cli@8.3.0
          base_url="baseURL = \"https://$GITHUB_REPOSITORY_OWNER.github.io/kubeflow-manifests/\""
          sed -i "1s#.*#$base_url#" config.toml
          hugo

      - name: Deploy website
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./kubeflow-manifests/website/public
          destination_dir: ./
          keep_files: true          
